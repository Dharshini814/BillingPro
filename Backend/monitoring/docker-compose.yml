# Docker Compose for BillingPro Monitoring Stack
# Phase 5: Operational Monitoring
#
# Starts:
# - Prometheus (metrics collection)
# - Grafana (dashboards)
#
# Usage:
#   docker-compose up -d
#   Access Grafana: http://localhost:3000 (admin/admin)
#   Access Prometheus: http://localhost:9090

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: billingpro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: billingpro-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_dashboard_overview.json:/etc/grafana/provisioning/dashboards/overview.json
      - ./grafana_dashboard_business.json:/etc/grafana/provisioning/dashboards/business.json
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
